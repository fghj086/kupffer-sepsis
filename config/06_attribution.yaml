  liv_TNFIFNg:  {study: GSE224127_cyto, test: TNFIFNg,  control: control, time_h: 12, cls: combo}
  liv_TNFIL6:   {study: GSE224127_cyto, test: TNFIL6,   control: control, time_h: 12, cls: combo}
  liv_IFNgIL1b: {study: GSE224127_cyto, test: IFNgIL1b, control: control, time_h: 12, cls: combo}
  liv_IL1bIL6:  {study: GSE224127_cyto, test: IL1bIL6,  control: control, time_h: 12, cls: combo}
  liv_IFNgIL6:  {study: GSE224127_cyto, test: IFNgIL6,  control: control, time_h: 12, cls: combo}
  liv_TNFIL1b:  {study: GSE224127_cyto2, test: TNFIL1b, control: control, time_h: 12, cls: combo}

# Panels used for attribution. Held-out references never enter a panel.
panels:
  # macrophage panel: one reference per stimulus, PAMP / DAMP / cytokine
  macrophage: [LPS_24h, KLA_6h, Pam3CSK4, PolyIC, CpG, dsHMGB1, TissueHom_6h, Hemin,
               ApoptoticHepCM, TNF, IL1b, IFNg, IFNb, IL6, IL10]
  # macrophage panel plus tolerance / late-LPS / glucocorticoid references
  macrophage_resolution: [LPS_24h, KLA_6h, Pam3CSK4, PolyIC, CpG, dsHMGB1, TissueHom_6h, Hemin,
                          ApoptoticHepCM, TNF, IL1b, IFNg, IFNb, IL6, IL10,
                          KC_TolLPS_6h, Tolerance_shift, Dex, Dex_on_LPS]
  # in vivo liver panel (single injected cytokines and LPS)
  liver: [liv_LPS, liv_TNF, liv_IL1b, liv_IFNg, liv_IL6, liv_IL10, liv_IL18]
  # liver panel plus macrophage DAMP and resolution references (cross-tissue; flagged)
  # (macrophage LPS references are included so that the macrophage HMGB1-like term cannot stand
  #  in for the macrophage inflammatory response as a whole)
  liver_plus: [liv_LPS, liv_TNF, liv_IL1b, liv_IFNg, liv_IL6, liv_IL10, liv_IL18,
               LPS_24h, KLA_6h, dsHMGB1, TissueHom_6h, KC_TolLPS_6h, Tolerance_shift, Dex]

  # two-reference panel for the in-vitro identifiability of the HMGB1-like component
  hmgb1_vs_lps: [LPS_24h, dsHMGB1]

# panel used for each target family (macrophage-type targets vs whole-tissue targets)
target_panels:
  macrophage_like: [macrophage, macrophage_resolution]
  tissue_like: [liver, liver_plus, macrophage_resolution]

model:
  collinear_r: 0.9        # reference pairs above this are flagged and merged for the main fit
  n_boot: 500             # gene bootstrap
  ridge_alpha: 0.1        # for signed fits of blockade (difference) contrasts
  # panels also fitted without merging collinear pairs (sensitivity; the LPS_24h / dsHMGB1 pair is
  # separable within GSE200210 by leave-one-replicate-out, but collinear above collinear_r)
  unmerged_sensitivity: [macrophage, macrophage_resolution, liver_plus]
# same stimulus measured in different studies, for the study-versus-stimulus comparison
cross_study_pairs:
  - [LPS_24h, KLA_6h]
  - [LPS_24h, LPS_24h_M1]
  - [LPS_24h, KC_LPS_6h]
  - [LPS_24h, LPS_RAW_14h]
  - [KLA_6h, KC_LPS_6h]
  - [KLA_6h, LPS_24h_M1]
  - [LPS_24h_M1, KC_LPS_6h]
  - [IFNg, IFNg_24h]
  - [PolyIC, PolyIC_RAW]
  - [liv_LPS, LPS_24h]
  - [liv_TNF, TNF]
  - [liv_IL1b, IL1b]
  - [liv_IFNg, IFNg]
  - [liv_IL6, IL6]
  - [liv_IL10, IL10]
controls:
  mixture_weights: [0.25, 0.5, 0.75]
  mixture_pairs:
    - [LPS_24h, dsHMGB1]
    - [LPS_24h, KC_TolLPS_6h]
    - [dsHMGB1, KC_TolLPS_6h]
    - [LPS_24h, IFNg]
    - [TNF, IL1b]
    - [IFNb, IFNg]
    - [LPS_24h, IL10]
    - [dsHMGB1, TissueHom_6h]
    - [LPS_24h, Dex]
    - [KLA_6h, TNF]
    - [liv_TNF, liv_IFNg]
    - [liv_LPS, liv_IL6]
  # held-out positive controls: target -> references expected to dominate
  heldout:
    LPS_IFNg_24h: {panel: macrophage, expect: [LPS_24h, KLA_6h, IFNg, IFNb]}
    KLA_IFNg_24h: {panel: macrophage, expect: [LPS_24h, KLA_6h, IFNg, IFNb]}
    LPS_RAW_14h: {panel: macrophage, expect: [LPS_24h, KLA_6h]}
    KC_LPS_6h: {panel: macrophage, expect: [LPS_24h, KLA_6h]}
    LPS_24h_M1: {panel: macrophage, expect: [LPS_24h, KLA_6h]}
    liv_TNFIFNg: {panel: liver, expect: [liv_TNF, liv_IFNg]}
    liv_TNFIL6: {panel: liver, expect: [liv_TNF, liv_IL6]}
    liv_IFNgIL1b: {panel: liver, expect: [liv_IFNg, liv_IL1b]}
    liv_IL1bIL6: {panel: liver, expect: [liv_IL1b, liv_IL6]}
    liv_IFNgIL6: {panel: liver, expect: [liv_IFNg, liv_IL6]}
    liv_TNFIL1b: {panel: liver, expect: [liv_TNF, liv_IL1b]}
  # magnitude-matched LPS test in GSE200210 (stage 01 scale factor)
  lps_scale: 0.74

