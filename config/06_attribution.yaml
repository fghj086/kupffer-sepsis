      LSEC_CLP_8h: {file: de_GSE311736_LSEC.tsv, family: tissue_like, cell: LSEC, time_h: 8}
      HEP_FSP_GSE303231: {file: de_GSE303231_HEP.tsv, family: tissue_like, cell: hepatocyte, time_h: .nan}
    min_base_mean: 20
  stage05:
    dir: results/05_proteomics
    files:
      liver_proteome_CLP_24h: {file: protein_de_PXD062961.tsv, family: tissue_like, cell: whole liver protein, time_h: 24}
      KC_protein_LPS_6h: {file: protein_de_Qie2022_KC_LPS_vs_PBS.tsv, family: macrophage_like, cell: KC protein (cultured), time_h: 6}
  stage04:
    # each GSE224127 batch against its own reference arm, as in stage 04
    timecourse:
      - {file_key: LPS_timecourse, model: LPS, reference: control}
