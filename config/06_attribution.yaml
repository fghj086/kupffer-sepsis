      - {file_key: CLP_CytoBlock2, test: IL1bKOantiTNF, reference: isotype}
      - {file_key: LPS_KO, test: LPSTNFKO, reference: LPS}
      - {file_key: LPS_KO, test: LPSantiTNF, reference: LPS}
      - {file_key: LPS_KO, test: LPSIRF1KO, reference: LPS}
      - {file_key: LPS_KO2, test: LPSSTAT1KO, reference: LPS}
      - {file_key: LPS_KO2, test: LPSIFNgKOantiTNF, reference: LPS}
      - {file_key: LPS_KO2, test: LPSIL1bKOantiTNF, reference: LPS}
      - {file_key: LPS_KO2, test: LPSIL18KOantiTNF, reference: LPS}
  stage03:
    # per-population pseudobulk log2FC tables, if stage 03 writes them
    candidates: [results/03_single_cell/pseudobulk_de.tsv, results/03_single_cell/population_de.tsv]
    min_cells: 30          # per condition and population
controls_panels:
  loro: [macrophage, macrophage_resolution, liver, hmgb1_vs_lps]
  mixture: [macrophage_resolution, liver]

