# Stage 06 — stimulus attribution of septic-liver transcriptional responses.
# Every reference is a within-study contrast (stimulus vs that study's own unstimulated arm);
# count matrices are never merged across studies. Reference vectors are differences of mean
# log2(normalised expression + prior) between arms; responsive genes are called within each study
# (pydeseq2 for raw counts, moderated t on log2 values for deposited normalised tables).
seed: 20261124
stage: 06_attribution

gene_map: data/raw/GSE200210/annotation/ens102_mouse_genes.tsv   # Ensembl 102 -> symbol, biotype
protein_coding_only: true

expression:
  prior_cpm: 1.0          # prior added on the CPM / FPKM scale before log2
  min_level: 1.0          # gene kept in a study if mean normalised level >= this in >= 1 arm of a contrast
responsive:
  padj: 0.05
  min_abs_lfc: 1.0
  top_n_per_reference: 300  # cap so one large response does not define the gene universe
  n_cpus: 8

# ---------------------------------------------------------------------------------------------
# Studies. kind: counts (raw integer counts) | norm (normalised linear scale: TMM, FPKM, DESeq2)
#                | log2 (already log2 scale)
# arms: regex on column name -> arm label (first match wins)
# ---------------------------------------------------------------------------------------------
studies:
  GSE200210:
    loader: gse200210
    cell: BMDM
    kind: counts
  GSE232827:
    loader: gse232827
    path: data/raw/06_GSE232827/GSE232827_raw_counts.csv.gz
    cell: BMDM
    kind: counts
    # column prefixes follow the GEO sample order (IFN-b, IFN-g, TGF-b, TNF, untreated);
    # the mapping is checked against canonical response genes when loaded
    arms: {"^Bib": IFNb, "^Big": IFNg, "^Btg": TGFb, "^Btn": TNF, "^But": untreated}
  GSE315641:
    loader: gse315641
    path: data/raw/06_GSE315641/GSE315641_TMMnorm-allbatches.txt.gz
    cell: BMDM
    kind: norm
    arms: {"^ctrl_T\\d": ctrl_b3, "^il1b_T\\d": IL1b, "^ctrl-\\d": ctrl_b2, "^ifny-\\d": IFNg,
           "^il6-\\d": IL6, "^il10-\\d": IL10}
  GSE72964:
    loader: gse72964
    path: data/raw/06_GSE72964/GSE72964_GeneExpression.txt.gz
    cell: BMDM
    kind: norm
    arms: {"\\.WT\\.BMDM\\.RNA-seq\\.no\\.treatment\\.6h": ctrl_6h,
           "\\.WT\\.BMDM\\.RNA-seq\\.no\\.treatment\\.24h": ctrl_24h,
           "\\.WT\\.BMDM\\.RNA-seq\\.KLA\\.6h": KLA_6h,
           "\\.WT\\.BMDM\\.RNA-seq\\.KLA\\+IFNg\\.24h": KLA_IFNg_24h,
           "\\.WT\\.BMDM\\.RNA-seq\\.Pam3CSK4\\.6h": Pam3_6h,
           "\\.WT\\.BMDM\\.RNA-seq\\.PolyIC\\.6h": PolyIC_6h,
           "\\.WT\\.BMDM\\.RNA-seq\\.tissuehomogenate\\.6h": TissueHom_6h,
           "\\.WT\\.BMDM\\.RNA-seq\\.tissuehomogenate\\.24h": TissueHom_24h}
  GSE221734:
    loader: gse221734
    path: data/raw/06_GSE221734/samples
    cell: BMDM
    kind: counts
    arms: {"WT-Veh-": vehicle, "WT-Hemin-": hemin}
  GSE193577:
    loader: gse193577
    path: data/raw/06_GSE193577/GSE193577_fpkm_sample.txt.gz
    cell: BMDM
    kind: norm
    arms: {"^WTNC_": untreated, "^WTACM_": ACM}
  GSE240633:
    loader: gse240633
    path: data/raw/06_GSE240633/GSE240633_R_RNA-seq_GEO_processed.txt.gz
    cell: RAW264.7
    kind: counts
    # A = Lamtor1-KO reconstituted with wild-type Lamtor1 (series-matrix descriptions A1-1 ...)
    arms: {"^A1-\\d_count": mock, "^A2-\\d_count": CpG, "^A5-\\d_count": PolyIC, "^A6-\\d_count": LPS}
  GSE300953:
    loader: gse300953
    path: data/raw/06_GSE300953/samples
    cell: Kupffer cell (primary, cultured)
    kind: log2
    arms: {"^Ctrl_": ctrl, "^LPS_": LPS_6h, "^Tol_": Tol_LPS_6h}
  GSE157518:
    loader: gse157518
    path: data/raw/06_GSE157518/GSE157518_Tol_Imm_counts.txt.gz
    cell: BMDM
    kind: counts
    arms: {"^IgG2_Imm_": naive_LPS_4h, "^IgG2_Tol_": tolerised_LPS_4h}
  GSE306502:
    loader: gse306502
    path: data/raw/06_GSE306502/samples
    cell: BMDM
    kind: counts
    arms: {"dFlox\\dM0Veh": M0_veh, "dFlox\\dM0Dex": M0_dex, "dFlox\\dM1Veh": M1_veh,
           "dFlox\\dM1Dex": M1_dex}
  GSE224127_cyto:
    loader: gse224127
    file_key: Cytokine_combo
    cell: whole liver (in vivo)
    kind: counts
  GSE224127_cyto2:
    loader: gse224127
    file_key: Cytokine_combo2
    cell: whole liver (in vivo)
    kind: counts
  GSE224127_lps:
    loader: gse224127
    file_key: LPS_vs_control
    cell: whole liver (in vivo)
    kind: counts

gse224127:
  design: results/04_timecourse/design.tsv
  raw_dir: data/raw/GSE224127
  extra_dir: data/processed/04_gse224127_extra

# ---------------------------------------------------------------------------------------------
# References: name -> study, test arm, control arm, time (h), stimulus class
# class: PAMP | DAMP | cytokine | resolution
# ---------------------------------------------------------------------------------------------
