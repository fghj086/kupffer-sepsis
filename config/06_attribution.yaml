  dsHMGB1:        {study: GSE200210, test: dsHMGB1,      control: PBS,       time_h: 24, cls: DAMP}
  frHMGB1:        {study: GSE200210, test: frHMGB1,      control: PBS,       time_h: 24, cls: DAMP}
  LPS_IFNg_24h:   {study: GSE200210, test: LPS_IFNg,     control: PBS,       time_h: 24, cls: PAMP}
  TNF:            {study: GSE232827, test: TNF,          control: untreated, time_h: 6,  cls: cytokine}
  IFNb:           {study: GSE232827, test: IFNb,         control: untreated, time_h: 6,  cls: cytokine}
  IFNg:           {study: GSE232827, test: IFNg,         control: untreated, time_h: 6,  cls: cytokine}
  IFNg_24h:       {study: GSE315641, test: IFNg,         control: ctrl_b2,   time_h: 24, cls: cytokine}
  IL1b:           {study: GSE315641, test: IL1b,         control: ctrl_b3,   time_h: 24, cls: cytokine}
  IL6:            {study: GSE315641, test: IL6,          control: ctrl_b2,   time_h: 24, cls: cytokine}
  IL10:           {study: GSE315641, test: IL10,         control: ctrl_b2,   time_h: 24, cls: resolution}
  KLA_6h:         {study: GSE72964,  test: KLA_6h,       control: ctrl_6h,   time_h: 6,  cls: PAMP}
  KLA_IFNg_24h:   {study: GSE72964,  test: KLA_IFNg_24h, control: ctrl_24h,  time_h: 24, cls: PAMP}
  Pam3CSK4:       {study: GSE72964,  test: Pam3_6h,      control: ctrl_6h,   time_h: 6,  cls: PAMP}
  PolyIC:         {study: GSE72964,  test: PolyIC_6h,    control: ctrl_6h,   time_h: 6,  cls: PAMP}
  TissueHom_6h:   {study: GSE72964,  test: TissueHom_6h, control: ctrl_6h,   time_h: 6,  cls: DAMP}
  TissueHom_24h:  {study: GSE72964,  test: TissueHom_24h, control: ctrl_24h, time_h: 24, cls: DAMP}
  Hemin:          {study: GSE221734, test: hemin,        control: vehicle,   time_h: 12, cls: DAMP}
  ApoptoticHepCM: {study: GSE193577, test: ACM,          control: untreated, time_h: 24, cls: DAMP}
  CpG:            {study: GSE240633, test: CpG,          control: mock,      time_h: 14, cls: PAMP}
  LPS_RAW_14h:    {study: GSE240633, test: LPS,          control: mock,      time_h: 14, cls: PAMP}
  PolyIC_RAW:     {study: GSE240633, test: PolyIC,       control: mock,      time_h: 14, cls: PAMP}
  KC_LPS_6h:      {study: GSE300953, test: LPS_6h,       control: ctrl,      time_h: 6,  cls: PAMP}
  KC_TolLPS_6h:   {study: GSE300953, test: Tol_LPS_6h,   control: ctrl,      time_h: 24, cls: resolution}
  Tolerance_shift: {study: GSE157518, test: tolerised_LPS_4h, control: naive_LPS_4h, time_h: 21, cls: resolution}
  LPS_24h_M1:     {study: GSE306502, test: M1_veh,       control: M0_veh,    time_h: 28, cls: PAMP}
  Dex:            {study: GSE306502, test: M0_dex,       control: M0_veh,    time_h: 4,  cls: resolution}
  Dex_on_LPS:     {study: GSE306502, test: M1_dex,       control: M1_veh,    time_h: 4,  cls: resolution}
  # in vivo whole liver, 0.5 d after injection (GSE224127)
  liv_TNF:   {study: GSE224127_cyto, test: TNF,   control: control, time_h: 12, cls: cytokine}
  liv_IL1b:  {study: GSE224127_cyto, test: IL1b,  control: control, time_h: 12, cls: cytokine}
  liv_IFNg:  {study: GSE224127_cyto, test: IFNg,  control: control, time_h: 12, cls: cytokine}
  liv_IL6:   {study: GSE224127_cyto, test: IL6,   control: control, time_h: 12, cls: cytokine}
  liv_IL10:  {study: GSE224127_cyto, test: IL10,  control: control, time_h: 12, cls: resolution}
  liv_IL18:  {study: GSE224127_cyto, test: IL18,  control: control, time_h: 12, cls: cytokine}
  liv_LPS:   {study: GSE224127_lps,  test: LPS,   control: control, time_h: 12, cls: PAMP}
