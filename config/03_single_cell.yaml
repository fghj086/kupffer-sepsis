# Stage 03: liver single-cell RNA-seq (GSE279167, GSE290684)
# Each dataset is processed on its own; Harmony only across samples inside GSE290684.
seed: 20261124
n_jobs: 32

datasets:
  GSE279167:
    raw_dir: data/raw/GSE279167
    files:
      GSM8563084: {file: GSM8563084_S2_filtered_feature_bc_matrix.h5, condition: sham, sample: sham_pool}
      GSM8563085: {file: GSM8563085_CLP_filtered_feature_bc_matrix.h5, condition: CLP, sample: CLP_pool}
    # two libraries, each = one condition; integration would remove the condition effect
    integrate: false
    replicate_unit: none   # sham pooled from 3 mice, CLP pooled from 4: effect sizes only
    reference: sham
  GSE290684:
    raw_dir: data/raw/GSE290684
    integrate: true        # Harmony across the 12 libraries of this dataset only
    replicate_unit: library
    reference: CLP_vehicle

qc:
  min_genes: 300
  max_genes: 7000
  min_counts: 600
  max_pct_mt: 20
  min_cells_per_gene: 10
  scrublet: true
  scrublet_threshold: null   # automatic threshold per library
  # clusters assigned Erythroid with median haemoglobin read fraction below this are
  # low-complexity ambient-rich droplets, labelled "Low quality (ambient-rich)" and not analysed
  erythroid_min_hb_fraction: 0.05

processing:
  target_sum: 10000
  n_hvg: 3000            # scanpy "seurat" flavour on log-normalised data
  n_pcs: 40
  n_neighbors: 20
  leiden_resolution: 1.0
  myeloid_n_pcs: 30
  myeloid_resolution: 1.2
  umap_max_cells: 20000

# Marker sets used for cluster annotation (cluster mean of scanpy score_genes; max wins,
# then checked against the per-cluster marker table).
cell_type_markers:
  Hepatocyte: [Alb, Ttr, Hnf4a, Apoa1, Apoc3, Serpina1c, Cyp2e1]
  LSEC: [Stab2, Clec4g, Kdr, Fcgr2b, Ptprb, Dnase1l3]
  HSC: [Lrat, Rgs5, Dcn, Reln, Pdgfrb, Colec11]
  Cholangiocyte: [Epcam, Krt19, Krt7, Spp1, Sox9]
  Kupffer: [Clec4f, Timd4, Vsig4, Marco, Cd5l, Clec1b]
  MonoMac: [Ccr2, Ly6c2, Chil3, Lyz2, Cx3cr1, Plac8, Ms4a6c, Adgre1, C1qa]
  Neutrophil: [S100a8, S100a9, Retnlg, Ngp, Camp, Ltf, Cxcr2, Csf3r]
  T_NK: [Cd3e, Cd3g, Trbc2, Cd8a, Cd4, Nkg7, Klrb1c, Gzma]
  B: [Cd79a, Cd79b, Ms4a1, Cd19, Ighm]
  pDC_DC: [Siglech, Bst2, Flt3, Xcr1, Clec9a, H2-Ab1, Cd209a]
  Plasma: [Jchain, Mzb1, Xbp1, Igkc]
  Erythroid: [Hba-a1, Hbb-bs, Hbb-bt, Alas2]
  Basophil_Mast: [Cpa3, Mcpt8, Prss34, Fcer1a]

myeloid_parents: [Kupffer, MonoMac]

# Myeloid subcluster labels from cluster means of four marker scores (z across subclusters).
# Labels are marker annotations, not lineage proof.
myeloid_subsets:
  kc_core: [Clec4f, Vsig4, Cd5l, Clec1b]
  resident_marker: [Timd4, Folr2, Cd163]  # Timd4 high = long-lived resident KC
  monocyte: [Ly6c2, Ccr2, Chil3, Plac8, Ms4a4c, F13a1]
  macrophage: [C1qa, C1qb, Adgre1, Csf1r, Ms4a7, Mafb]
  # granule / neutrophil-specific genes only: S100a8/9 are also induced in septic monocytes
  neutrophil_contam: [Ngp, Camp, Ltf, Retnlg, Cxcr2, Ly6g]
  kc_resident_min_z: 1.0     # kc_core z >= 1: KC markers at resident (sham-like) level
  kc_like_min_z: 0.0         # 0 <= kc_core z < 1: KC-marker-intermediate (KC-like)
  rules: |
    neutrophil_contam z > 1 and kc_core z < 0          -> drop (neutrophil contamination)
    kc_core z >= kc_resident_min_z                     -> Resident KC
    kc_like_min_z <= kc_core z < kc_resident_min_z     -> KC-like (KC-marker-intermediate)
    kc_core z < 0 and monocyte z >= macrophage z       -> Monocytes
    kc_core z < 0 and monocyte z <  macrophage z       -> Recruited Mo-macrophages
    resident_marker (Timd4/Folr2/Cd163) is reported per subcluster, not used for the call

# Program gene sets (mouse symbols).
programs:
  inflammatory: [Il1b, Il1a, Tnf, Il6, Cxcl1, Cxcl2, Cxcl10, Ccl2, Ccl3, Ccl4, Ccl7, Ptgs2,
                 Nfkbia, Nfkbiz, Tnfaip3, Socs3, Ier3, Nlrp3, Irf1, Il10, Cd14, Saa3]
  kc_identity: [Clec4f, Timd4, Nr1h3, Id3, Spic, Slc40a1, Folr2, Vcam1, Cdh5, Kcna2]
  clearance_curated: [Marco, Msr1, Cd5l, Vsig4, Clec4f, Timd4, C1qa, C1qb, C1qc, Cd163,
                      Siglec1, Mrc1, Cd36, Colec12, Axl, Mertk, Stab1, Fcgr1, Fcgr3]
  # GO:0006909 phagocytosis fetched at run time (gseapy Enrichr GO_Biological_Process_2023),
  # human symbols mapped to mouse by case (only genes present in the data are kept);
  # the list used is written to results/03_single_cell/gene_sets.tsv
  go_term: "Phagocytosis (GO:0006909)"
  go_library: GO_Biological_Process_2023
  # inflammation score shared with the sorted-cell stage (Hallmark TNFA signalling via NF-kB)
  hallmark_library: MSigDB_Hallmark_2020
  hallmark_term: "TNF-alpha Signaling via NF-kB"
  # clearance_curated_no_annotation / phagocytosis_GO_no_annotation drop every gene used in
  # kc_identity or myeloid_subsets (built at run time, listed in gene_sets.tsv)

ligand_receptor:
  ligand: Hmgb1
  receptors: [Tlr4, Ly96, Cd14, Ager, Tlr2, Cxcr4]
  # score = mean log-normalized ligand expression in source x mean in target (LIANA not installed)

signatures_path: results/01_perturbation/signatures.tsv
processed_dir: data/processed
