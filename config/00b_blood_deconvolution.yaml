# Stage 00b — leukocyte proportions of the septic blood samples by deconvolution against
# GSE60424 (neutrophils, monocytes, B, CD4, CD8 and NK cells sorted from whole blood).
# Read by stage 07 (mortality models adjusted for deconvolved proportions).
seed: 20261124
stage: 00b_blood_deconvolution
raw: data/human/raw
processed: data/human/processed
cohort_tables: results/00a_blood_cohorts
# cohorts deconvolved (septic samples only; healthy controls calibrate each platform)
cohorts: [GAINS, GSE95233, GSE222393, GSE57065]
deconvolution:
  reference: reference_sorted          # GSE60424, under raw
  donors: [Healthy Control, Sepsis]
  genes_per_type: 30
  min_margin: 1.5                      # log2 CPM above every other sorted type
  # typical adult leukocyte differential used to calibrate each platform on its healthy controls
  healthy_prior: {Neutrophils: 0.61, Monocytes: 0.07, B-cells: 0.05, CD4: 0.15, CD8: 0.08, NK: 0.04}
