# Stage 02 — sorted liver cell bulk RNA-seq after polymicrobial sepsis
# GSE328774 (KC, CLP 2 h), GSE311736 (HEP/KC/HSC/LSEC/CD45+ non-KC, CLP 8 h),
# GSE303231 (isolated hepatocytes, faecal-slurry peritonitis, both sexes).
# Each dataset and each sorted cell type is modelled on its own; studies are compared only
# through effect sizes and directions (never one merged count matrix).
seed: 20261124
stage: 02_sorted_bulk

data:
  GSE328774:
    counts: data/raw/GSE328774/GSE328774_counts.txt.gz
    series_matrix: data/raw/GSE328774/GSE328774_series_matrix.txt.gz
  GSE311736:
    counts: data/raw/GSE311736/GSE311736_counts.txt.gz
    series_matrix: data/raw/GSE311736/GSE311736_series_matrix.txt.gz
  GSE303231:
    counts: data/raw/GSE303231/GSE303231_all_samples_counts.tsv.gz   # kallisto transcript estimates, 2 lanes/library
    series_matrix: data/raw/GSE303231/GSE303231_series_matrix.txt.gz
  # GENCODE vM30 (Ensembl 107, GRCm39), the annotation used by the GSE328774/GSE311736 depositors
  gtf: data/raw/GSE311736/gencode.vM30.annotation.gtf.gz
  # MSigDB 2024.1.Mm mouse-native collections (same files as stage 01)
  gmt:
    hallmark: data/raw/GSE200210/annotation/mh.all.v2024.1.Mm.symbols.gmt
    go_bp: data/raw/GSE200210/annotation/m5.go.bp.v2024.1.Mm.symbols.gmt
    reactome: data/raw/GSE200210/annotation/m2.cp.reactome.v2024.1.Mm.symbols.gmt
  signatures: results/01_perturbation/signatures.tsv   # written by stage 01 (may be absent)

# GSE303231 libraries described in the GEO record; water blanks and ERCC spike-in re-preparations
# of one control library are technical controls and are excluded. Undescribed libraries in the
# count file (D13-D20, UTD1-UTD9) are not part of this series and are not read.
gse303231_samples:
  UTP1: {sex: male, condition: control}
  UTP2: {sex: male, condition: control}
  UTP3: {sex: male, condition: control}
  UTP4: {sex: male, condition: control}
  UTP5: {sex: female, condition: control}
  UTP6: {sex: female, condition: control}
  UTP7: {sex: female, condition: control}
  C14: {sex: male, condition: sepsis}
  C15: {sex: male, condition: sepsis}
  C16: {sex: male, condition: sepsis}
  C17: {sex: male, condition: sepsis}
  C18: {sex: female, condition: sepsis}
  C19: {sex: female, condition: sepsis}
  C20: {sex: female, condition: sepsis}

filter:
  min_count: 10            # gene kept if >= min_count reads ...
  min_samples: 3           # ... in at least this many libraries of the contrast
  protein_coding_only: true

de:
  alpha: 0.05
  min_abs_lfc: 1.0         # |log2FC| for a "responsive" gene in the concordance summaries
  n_cpus: 8
  ci_level: 0.95           # Wald interval on the MLE log2 fold change

scoring:
  pseudocount: 1.0         # log2(median-of-ratios normalised count + pseudocount), within each dataset x cell type
  # per gene: centred on the sham/control mean, scaled by the pooled within-group SD
  min_genes: 5

genes:
  chemokines_cytokines: [Ccl2, Cxcl1, Cxcl2, Ccl3, Ccl4, Il1b, Tnf, Il6]
  hmgb1_axis: [Hmgb1, Tlr4, Ly96, Cd14, Ager, Myd88, Casp4, Gsdmd]
  kc_identity: [Clec4f, Timd4, Vsig4, Id3, Nr1h3]
  monocyte_recruited: [Ccr2, Ly6c2, Chil3, Lyz2]
  # Curated macrophage pathogen-clearance genes (identical to stage 01; sources: Helmy et al. 2006
  # Cell and Zeng et al. 2016 Cell Host Microbe (CRIg/Vsig4); Sanchez-Moral et al. 2021 Front Immunol
  # (Cd5l); van der Laan et al. 1999 / Arredouani et al. 2005 (Marco); Peiser & Gordon 2001 (Msr1);
  # Gordon 2016 Immunity (phagocytosis)).
  clearance: [Marco, Msr1, Cd5l, Vsig4, Clec4f, Timd4, Cd163, Mrc1, Cd36, Colec12,
              Siglec1, Stab1, Fcgr1, Fcgr2b, Fcgr3, Fcgr4, Itgam, Itgb2, C1qa, C1qb,
              C1qc, C3, C3ar1, C5ar1, Cfp, Cd93, Lyz2, Cybb, Ncf1, Nos2, Slc11a1, Mertk,
              Axl, Gas6, Clec7a, Cd209b]
  acute_phase: [Saa1, Saa2, Saa3, Lcn2, Orm2, Hp, Fgb, Fga, Fgg, Lbp, Serpina3n, Hamp, Apcs, Socs3]
  hepatocyte_stress: [Atf3, Hmox1, Gadd45b, Gadd45g, Ddit3, Cdkn1a, Mt1, Mt2, Hspa1a, Hspa1b, Egr1, Fos, Jun, Myc]

# sample-level programmes (name -> list of genes, or a gene-set name from the gmt files)
programs:
  inflammation_hallmark_tnfa_nfkb: HALLMARK_TNFA_SIGNALING_VIA_NFKB
  inflammation_hallmark_inflammatory: HALLMARK_INFLAMMATORY_RESPONSE
  chemokines_cytokines: chemokines_cytokines
  clearance_curated: clearance
  clearance_curated_no_identity: clearance_minus_identity   # clearance minus kc_identity and monocyte_recruited
  go_phagocytosis: GOBP_PHAGOCYTOSIS
  reactome_scavenger: REACTOME_BINDING_AND_UPTAKE_OF_LIGANDS_BY_SCAVENGER_RECEPTORS
  kc_identity: kc_identity
  monocyte_recruited: monocyte_recruited
  hmgb1_axis: hmgb1_axis
  acute_phase: acute_phase
  hepatocyte_stress: hepatocyte_stress

# non-KC leukocyte admixture in the sorted KC fraction (GSE311736): genes >= min_ratio-fold higher
# in sham CD45+ non-KC than in sham KC, expressed in CD45+ non-KC, and not changed by CLP there
admixture:
  min_ratio: 20
  min_cpm_cd45: 20
  max_abs_lfc_cd45: 0.5

# marker genes used only to report sort purity / carry-over between fractions
purity_markers:
  hepatocyte: [Alb, Apoa1, Cyp2e1]
  kupffer: [Clec4f, Vsig4, Cd5l]
  endothelial: [Kdr, Stab2, Pecam1]
  stellate: [Lrat, Reln, Dcn]
  leukocyte: [Ptprc]
  monocyte_neutrophil: [Ly6c2, Ccr2, S100a8, S100a9, Ly6g]
  lymphocyte: [Cd3e, Cd79a, Nkg7]
